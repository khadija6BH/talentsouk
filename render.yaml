# Free preview configuration. Durable upload storage must be configured before launch.
services:
  - type: web
    name: talentsouk
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: STORAGE_ROOT
        value: /data
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_BACKEND
        value: postgres
      - key: DATABASE_SCHEMA
        value: talentsouk
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_STORAGE
        value: supabase
      - key: SUPABASE_URL
        value: https://jmmwqrqbmxybjmqnundd.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: talentsouk-private
      - key: SUPABASE_STORAGE_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: RADAR_AUTO_SYNC
        value: "0"
