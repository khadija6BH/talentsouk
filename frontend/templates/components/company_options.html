{% macro company_options(companies, selected='', crm=false) %}{% for domain,rows in companies|company_option_groups %}<optgroup label="{{ domain }}">{% for company in rows %}<option value="{{ company.id }}" {{ 'selected' if selected|string==company.id|string }}{% if crm %} data-email="{{ company.email }}" data-category="{{ company.display_category }}" data-domains='{{ company.domains|tojson }}' data-url="{{ url_for('company_detail',company_id=company.id) }}"{% endif %}>{{ company.name }}</option>{% endfor %}</optgroup>{% endfor %}{% endmacro %}
