{% if tutorial_step %}<div id="tutorial-highlight" aria-hidden="true"></div><section id="tutorial-guide" role="dialog" aria-modal="false" aria-labelledby="tutorial-title" aria-describedby="tutorial-description" data-action-url="{{ url_for('tutorial_action') }}" data-step='{{ tutorial_step|tojson }}'><div class="tutorial-guide-top"><span id="tutorial-progress"></span><button type="button" data-tutorial-action="skip" aria-label="Skip tutorial">×</button></div><progress id="tutorial-progress-bar" max="{{ tutorial_step.total }}" value="{{ tutorial_step.index+1 }}" aria-label="Tutorial progress"></progress><h2 id="tutorial-title"></h2><p id="tutorial-description"></p><p id="tutorial-error" role="alert" hidden></p><footer><button type="button" class="btn btn-ghost" data-tutorial-action="skip">Skip tutorial</button><div><button type="button" class="btn btn-secondary" data-tutorial-action="previous" id="tutorial-back">Back</button><button type="button" class="btn btn-primary" data-tutorial-action="next" id="tutorial-next">Next →</button></div></footer></section><script src="{{ url_for('static',filename='js/tutorial.js',v='20261023-v1') }}" defer></script>{% endif %}
