<div class="grid md:grid-cols-2 gap-4 network-form">
<label>Name<input name="name" value="{{ values.get('name','') }}" maxlength="200" required></label><label>Role / position<input name="role" value="{{ values.get('role','') }}" maxlength="200" placeholder="Recruiter, team lead..."></label>
<label>Link to a company in TalentSouk<select name="company_id"><option value="0">No linked company</option>{% from 'components/company_options.html' import company_options with context %}{{ company_options(companies,values.get('company_id',0)) }}</select></label><label>Company name, if not linked<input name="company_name" value="{{ values.get('company_name','') }}" maxlength="250"></label>
<label>Email (optional)<input name="email" type="email" value="{{ values.get('email','') }}" maxlength="250"></label><label>Professional profile link<input name="profile_url" type="url" value="{{ values.get('profile_url','') }}" maxlength="2000" placeholder="https://..."></label>
<label>Where did you find this contact?<input name="source" value="{{ values.get('source','') }}" maxlength="250" placeholder="LinkedIn, event, referral..."></label><label>Source link (optional)<input name="source_url" type="url" value="{{ values.get('source_url','') }}" maxlength="2000"></label>
<label>Next follow-up<input name="next_followup" type="date" value="{{ values.get('next_followup','') }}"><span class="text-xs text-slate-500">Clear this date once the follow-up is done.</span></label><label>Private notes<textarea name="notes" rows="3" maxlength="4000">{{ values.get('notes','') }}</textarea></label></div>
