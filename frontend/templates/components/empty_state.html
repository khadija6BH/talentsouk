{#
  Reusable "coming soon / empty" state.
  Usage: {% include "components/empty_state.html" %}
  Optionally set `empty_title` and `empty_message` before including.
#}
<div class="card flex flex-col items-center justify-center text-center px-6 py-20">
  <div class="w-14 h-14 rounded-2xl bg-blue-50 flex items-center justify-center mb-5">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#673147" stroke-width="1.8">
      <path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.5-6.5-2 2m-9 9-2 2m0-13 2 2m9 9 2 2"/>
      <circle cx="12" cy="12" r="3.5"/>
    </svg>
  </div>
  <h2 class="font-display font-semibold text-slate-800 text-lg mb-1.5">
    {{ empty_title or "This page is being built" }}
  </h2>
  <p class="text-sm text-slate-500 max-w-sm">
    {{ empty_message or "This section will be available in an upcoming task." }}
  </p>
</div>
